<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNA 2036 // NEW ENGINE — playable skeleton</title>
<style>
  :root{--bg:#04060d;--cyan:#3fd8ff;--amber:#ffb02e;--red:#ff4954;--green:#69f58c;--ink:#dfe9f5;--dim:#7d8ca3;--panel:rgba(9,15,28,.9)}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink)}
  canvas{display:block}
  .hud{position:fixed;left:12px;top:12px;z-index:5;background:var(--panel);border:1px solid rgba(63,216,255,.25);padding:10px 12px;font-size:11px;line-height:1.7;min-width:230px}
  .hud b{color:var(--cyan)}
  .hud .warn{color:var(--amber)} .hud .bad{color:var(--red)} .hud .ok{color:var(--green)}
  .keys{position:fixed;right:12px;top:12px;z-index:5;background:var(--panel);border:1px solid rgba(63,216,255,.25);padding:10px 12px;font-size:10px;line-height:1.8;color:var(--dim)}
  .keys b{color:var(--ink)}
  #banner{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;background:var(--panel);border:1px solid rgba(255,176,46,.4);color:var(--amber);padding:8px 16px;font-size:12px;letter-spacing:.08em;display:none}
  #director{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;color:#ff9be0;font-size:12px;opacity:.9;text-shadow:0 0 14px rgba(255,90,209,.5);pointer-events:none}
  a{color:var(--dim)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud">
  <div><b>LUNA 2036</b> // NEW ENGINE — SKELETON</div>
  <div>ALT <b id="hAlt">—</b> · SPD <b id="hSpd">—</b></div>
  <div>HULL <b id="hHull" class="ok">—</b> · MODULES <b id="hMod">—</b></div>
  <div>SALVAGE <b id="hSalv" class="ok">0</b> · BEST <a href="index.html">classic game →</a></div>
</div>
<div class="keys">
  <div><b>A</b>/<b>D</b> rotate · <b>W</b> main burn · <b>S</b> retro</div>
  <div><b>SPACE</b> fire cannon · <b>R</b> reset demo</div>
  <div>Bolts are gravity-bent. So is your ship.</div>
</div>
<div id="director"></div>
<div id="banner">VESSEL LOST — <b>R</b> TO REBUILD</div>
<script type="module" src="src/demo.js"></script>
</body>
</html>
